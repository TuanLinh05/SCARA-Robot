<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">SCARA drawing robot: hardware + simulation</title><desc id="desc">Two rotary joints and one vertical axis; physical position is estimated from emitted step pulses</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#168c7a" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f3f7fa"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="32" fill="#17324d" font-weight="700">SCARA drawing robot: hardware + simulation</text><text x="42" y="93" font-family="Arial, sans-serif" font-size="19" fill="#486277" font-weight="400">Two rotary joints and one vertical axis; physical position is estimated from emitted step pulses</text><rect x="42" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Cartesian GUI R14</text><text x="64" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Tkinter + pyserial</text><text x="64" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Drawing / paths / calibration</text><text x="64" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Protocol 5 + session checks</text><rect x="442" y="132" width="315" height="165" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="464" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">STM32 firmware R9</text><text x="464" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Blue Pill + Zephyr 3.7</text><text x="464" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">USB CDC, command FIFO</text><text x="464" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Home + watchdog + limits</text><rect x="842" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Robot hardware</text><text x="864" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">TB6600: Z / J1 / J2</text><text x="864" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Six COM-NC limit switches</text><text x="864" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">X-SCARA frame + arms</text><rect x="42" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Shared simulation data</text><text x="64" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">SI geometry + configuration</text><text x="64" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Drawing trajectory CSV</text><text x="64" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">STL source manifest</text><rect x="442" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="464" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">MATLAB / Simulink</text><text x="464" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Analytical dynamics + PID</text><text x="464" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">IK and 3D visualization</text><text x="464" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Export data and figures</text><rect x="842" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Webots model</text><text x="864" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Rigid-body + pen contact</text><text x="864" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Position or torque / force PID</text><text x="864" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Offline checks in repository</text><path d="M357 213 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="359" y="191" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">USB CDC</text><path d="M757 213 H830" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="767" y="191" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">STEP / DIR</text><path d="M842 284 H769" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="769" y="327" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">limits</text><path d="M357 478 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M199 559 V600 H1000 V559" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="646" font-family="Arial, sans-serif" font-size="21" fill="#17324d" font-weight="700">Simulation has encoder feedback; the physical drawing robot has no encoder-based position feedback.</text></svg>
